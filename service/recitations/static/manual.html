<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ручной элайнер · synchronized</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark;
    --bg:#faf7f0; --fg:#201d16; --muted:#9a917f; --dim:#b9b1a0; --line:rgba(120,110,90,.18);
    --accent:#b8891a; --hot:#2e8b45; --done:#3f7fb0; --card:#fffdf7; --chip:#f0ead9;
    --arab-font:"Scheherazade New","Amiri","Times New Roman",serif; --ayah-size:2.1rem; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#100f0b; --fg:#efe8d6; --muted:#7c745f; --dim:#3f3a2e; --line:rgba(200,190,160,.14);
      --accent:#e4bf4a; --hot:#5ed07f; --done:#5aa0d0; --card:#191710; --chip:#211e15; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--arab-font); }
  body { overscroll-behavior-y:contain; overflow-x:hidden; }
  header { position:sticky; top:0; z-index:20; background:var(--card);
    border-bottom:1px solid var(--line); box-shadow:0 3px 14px rgba(0,0,0,.14); }
  .top { display:flex; align-items:center; gap:10px; padding:6px 12px; direction:ltr; }
  .back { text-decoration:none; color:var(--muted); font:600 24px system-ui; padding:0 6px; border-radius:8px; }
  .back:active { background:var(--chip); }
  .title { flex:1; min-width:0; }
  .title b { display:block; font:600 14px system-ui; color:var(--fg);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title span { font:11px system-ui; color:var(--muted); }
  .tag { flex:none; background:var(--accent); color:#fff; font:600 11px system-ui;
    padding:4px 9px; border-radius:8px; }
  audio { display:block; width:100%; height:36px; padding:0 8px 6px; }
  /* панель клавиш + статус записи */
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; direction:ltr;
    padding:6px 12px 8px; font:12px system-ui; color:var(--muted); }
  .bar kbd { font:600 11px system-ui; background:var(--chip); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  .bar .rec { font-weight:700; }
  .bar .rec.on { color:var(--hot); }        /* пишем */
  .bar .rec.frozen { color:var(--accent); } /* заморозка после перемотки */
  .bar .rec.off { color:var(--muted); }     /* пауза / мышь вне текста */
  .bar .btn { cursor:pointer; background:var(--chip); border:1px solid var(--line);
    color:var(--fg); font:600 11px system-ui; padding:4px 10px; border-radius:8px; }
  .bar .btn:active { opacity:.7; }
  .bar .btn.warn { color:#c0492f; }
  /* текст аятов — сплошной поток, слова кликом НЕ перематывают (мышь = ввод) */
  #text { position:relative; padding:4vh 20px 60vh; width:100%; max-width:860px; margin:0 auto;
    font-family:var(--arab-font); font-size:var(--ayah-size); line-height:calc(var(--ayah-size) * 2.3);
    text-align:justify; text-align-last:center; -webkit-user-select:none; user-select:none; }
  .stitle { display:block; text-align:center; color:var(--accent);
    font:600 clamp(1rem,4vw,1.3rem) system-ui; margin:24px 0 12px; opacity:.7; }
  .ayah { color:var(--fg); }
  .ayah .num { font:600 .6em system-ui; color:var(--muted); margin:0 .4em; opacity:.8; white-space:nowrap; }
  .w { border-radius:8px; padding:.02em .14em; transition:background .12s, color .12s; }
  .w.done  { background:color-mix(in srgb, var(--done) 26%, transparent); } /* уже записано */
  .w.at    { box-shadow:inset 0 -.12em 0 var(--accent); }                   /* позиция по исходному прогону (гид) */
  .w.focus { outline:2px solid var(--hot); outline-offset:1px; }            /* текущий фокус (курсор ввода) */
  .w.rec   { color:#fff; background:var(--hot); box-shadow:0 1px 10px rgba(46,139,69,.42); } /* фокус + аудио играет = пишется */
  .w { cursor:pointer; }                                                    /* клик по слову = возврат фокуса */
  .bar select.spd { font:600 11px system-ui; background:var(--chip); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:3px 6px; }
  .bar .btn.tgl.on { color:var(--hot); border-color:color-mix(in srgb, var(--hot) 50%, var(--line)); }
  #loading,#err { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; color:var(--muted); font:15px system-ui; padding:20px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="back" href="index.html" title="назад">‹</a>
    <div class="title"><b id="ttl">—</b><span id="sub"></span></div>
    <span class="tag">ручной элайнер</span>
  </div>
  <audio id="audio" controls preload="metadata"></audio>
  <div class="bar">
    <span><kbd>Space</kbd> пауза</span>
    <span><kbd>←</kbd> след. слово · <kbd>→</kbd> назад на слово</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> скорость</span>
    <label>скорость <select class="spd" id="spd" title="замедлить чтеца — легче успевать вести фокус">
      <option value="1" selected>1×</option><option value="0.75">0.75×</option>
      <option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
    <button class="btn tgl on" id="btnAuto" title="автоскролл текста за фокусом">⭯ автоскролл</button>
    <span>клик по слову = возврат фокуса (перечитка) · hover не пишется</span>
    <span class="rec off" id="recState">⏸ пауза</span>
    <span id="stats">интервалов: 0 · покрыто слов: 0</span>
    <button class="btn" id="btnSeed" title="залить привязку прогона как отправную точку (иначе пишешь с нуля)">↻ из прогона</button>
    <button class="btn" id="btnSave" title="сохранить как прогон «manual» в бэк → появится выбираемым в плеере">💾 Сохранить в бэк</button>
    <button class="btn" id="btnCopy">Копировать JSON</button>
    <button class="btn" id="btnDl">Скачать JSON</button>
    <button class="btn warn" id="btnClear">Очистить</button>
  </div>
</header>
<div id="text"><div id="loading">загрузка…</div></div>

<script>
// РУЧНОЙ ЭЛАЙНЕР (П12) — v3 (владелец 25.07 tg_3610: hover/dwell выкинуты, только КЛИКИ+КЛАВИШИ).
// Модель: есть СЛОВО-ФОКУС (курсор ввода). Пока аудио играет — фокус-слово «пишется» (открытый
// интервал [focusStart, t] в АУДИО-шкале). Смена фокуса коммитит интервал:
//   ← следующее слово (вперёд по чтению, RTL)   → назад на одно слово (мелкая коррекция)
//   клик по слову = ВОЗВРАТ фокуса на него (перечитка: слово пишется второй раз → возврат сам
//     ложится в дорожку; повтор помечается rep=True в экспорте)
//   ↑/↓ скорость (до 1× / до 0.25×)          Space пауза аудио
// Мышь-HOVER игнорируется полностью (нет каши от случайных задеваний). Пишем С НУЛЯ по слуху →
// эталон возвратов/синхрона для сверки алгоритмов (±100-200мс не важны, важны сами возвраты/порядок).
// «↻ из прогона» заливает привязку прогона как старт; «Очистить» — пустой лист. «💾 Сохранить в бэк»
// → POST /r/<id>/manual/save → прогон «manual» (выбираемый в плеере). Автоскролл едет за фокусом,
// маркер .at (жёлтый) = позиция по исходному прогону (гид для сверки на слух).
const QS = new URLSearchParams(location.search);
const REC_ID = QS.get('rec');
const ASR = QS.get('asr');
const API = (QS.get('api') || '').replace(/\/$/, '');
const DATA_URL = REC_ID ? (API + '/r/' + REC_ID + '/data.json' + (ASR ? '?asr='+encodeURIComponent(ASR) : '')) : null;

const audio = document.getElementById('audio');
const textEl = document.getElementById('text');
const recState = document.getElementById('recState');
const statsEl = document.getElementById('stats');

let DATA = null;
let wordEl = {};                 // "surah:ayah:wi" -> span (канон Tanzil)
let wordOrder = [];              // ключи слов в порядке чтения (для фокуса ←/→)
let events = [];                 // [{k, a, b}] записанные интервалы В ПОРЯДКЕ записи (повторы = дубли ключа)
let focusIdx = -1;               // индекс текущего слова-фокуса в wordOrder (курсор ввода)
let focusStart = 0;              // audio-время, когда фокус встал на текущее слово (начало открытого интервала)
let posRef = [];                 // [{k,a,b}] позиция чтеца по исходному прогону — гид (маркер .at)
let atKey = null;                // слово-гид позиции по прогону (маркер .at)
let autoScroll = true;           // скроллить текст за фокусом
let userScrollUntil = 0;         // после ручного колеса/свайпа уважаем его до этого момента
let scrollCoolUntil = 0;         // антидребезг программного скролла
let lastT = 0;                   // audio.currentTime на прошлом кадре (для шва перемотки)
const MIN_LEN = 0.05;            // короче — дребезг, не пишем
const SPEEDS = [0.25, 0.5, 0.75, 1];   // ↑ ускоряет до 1× (норма, не 2×), ↓ замедляет до 0.25× (0.1 убран — не проигрывает)
const BAND_TOP = 0.30, BAND_BOT = 0.55, BAND_AIM = 0.38;  // держим фокус в этой вертикальной полосе окна

const fmt = t => { t=Math.max(0,t|0); return (t/60|0)+':'+String(t%60).padStart(2,'0'); };
const toArabic = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

init();
async function init(){
  if(!DATA_URL){ fail('не задана запись (?rec=…)'); return; }
  let d;
  try { const r = await fetch(DATA_URL); if(!r.ok) throw 0; d = await r.json(); }
  catch(e){ fail('не удалось загрузить данные (нужен готовый прогон у записи)'); return; }
  DATA = d;
  document.title = (d.title || 'запись') + ' · ручной элайнер';
  document.getElementById('ttl').textContent = d.title || 'запись';
  document.getElementById('sub').textContent = (d.reciter ? d.reciter+' · ' : '') + fmt(d.duration||0);
  audio.src = API + DATA.audio;
  renderText();
  posRef = computeIntervals(DATA.word_timeline);   // гид позиции по прогону (маркер .at), не зависит от Очистки
  events = [];                                      // пишем С НУЛЯ по слуху (эталон возвратов); «↻ из прогона» зальёт
  paintDone(); updateStats();
  setFocus(0, 0);            // старт-фокус на первом слове
  initSpeed();
  initAutoScroll();
  wireKeyboard();
  wireButtons();
  requestAnimationFrame(tick);
}

// [{surah,ayah,wi,t,t_end?}] → [{k,a,b}] отсортировано по a; конец приближаем при отсутствии t_end
function computeIntervals(wt){
  if(!wt || !wt.length) return [];
  const src = wt.slice().sort((x,y)=>x.t - y.t);
  const out = [];
  for(let i=0; i<src.length; i++){
    const e = src[i];
    const k = e.surah+':'+e.ayah+':'+e.wi;
    if(!(k in wordEl)) continue;                       // слова нет в тексте (иная редакция) → пропуск
    const a = +e.t || 0;
    let b = (typeof e.t_end === 'number') ? e.t_end : null;
    if(b === null){ const nx = src[i+1]; b = nx ? Math.min(nx.t, a + _SPAN_CAP) : a + _SPAN_CAP; }
    if(b - a >= MIN_LEN) out.push({k, a, b});
  }
  out.sort((x,y)=>x.a - y.a);
  return out;
}

// скорость воспроизведения — замедление чтеца, чтобы успевать вести мышью (времена пишутся в
// АУДИО-шкале и от playbackRate не зависят). Хранится в localStorage.
function initSpeed(){
  const sp = document.getElementById('spd');
  let v = parseFloat(localStorage.getItem('sync.manualspeed'));
  if(!(v > 0)) v = 1;
  applySpeed(v); sp.value = String(v);
  sp.onchange = () => applySpeed(parseFloat(sp.value) || 1);
}
function applySpeed(v){
  v = Math.max(0.25, Math.min(1, v));      // ↑ до 1× (норма, не 2×), ↓ до 0.25× (0.1 убран — не проигрывает)
  audio.playbackRate = v;
  localStorage.setItem('sync.manualspeed', String(v));
  const sp = document.getElementById('spd'); if(sp) sp.value = String(v);
}
function changeSpeed(dir){
  let i = SPEEDS.indexOf(audio.playbackRate);
  if(i < 0){ i = SPEEDS.reduce((bi,s,idx)=> Math.abs(s-audio.playbackRate)<Math.abs(SPEEDS[bi]-audio.playbackRate)?idx:bi, 0); }
  i = Math.max(0, Math.min(SPEEDS.length-1, i + dir));
  applySpeed(SPEEDS[i]);
}
function initAutoScroll(){
  autoScroll = localStorage.getItem('sync.manualauto') !== '0';
  const b = document.getElementById('btnAuto');
  const paint = () => b.classList.toggle('on', autoScroll);
  paint();
  b.onclick = () => { autoScroll = !autoScroll; localStorage.setItem('sync.manualauto', autoScroll?'1':'0'); paint(); };
  // ручной скролл (колесо/свайп) уважаем — приостанавливает автоскролл на время
  const hold = () => { userScrollUntil = performance.now() + 2500; };
  addEventListener('wheel', hold, {passive:true});
  addEventListener('touchmove', hold, {passive:true});
}

// Предзагрузка: word_timeline прогона (forced/asr) → готовые интервалы, которые можно ПРАВИТЬ
// мышью (overwrite-merge). Это корректирующий сценарий v1: инструмент чинит уже выровненную
// запись, а не заставляет размечать с нуля. t_end у ASR-прогонов часто нет → приближаем зазором
// до следующего слова (потолок _SPAN_CAP, как на беке), чтобы интервал был осмысленной длины.
const _SPAN_CAP = 0.6;
function seedFromData(){
  events = computeIntervals((DATA && DATA.word_timeline) || []);
  paintDone(); updateStats();
  return events.length;
}

// рендер слов (только Tanzil-редакция — по ней канон wi). Клик по слову = ВОЗВРАТ фокуса на это
// слово (перечитка); hover НЕ пишется. wordOrder — порядок чтения для ←/→.
function renderText(){
  textEl.innerHTML=''; wordEl={}; wordOrder=[];
  for(const sec of DATA.sections){
    const h=document.createElement('div'); h.className='stitle';
    h.textContent='سورة '+sec.title; textEl.appendChild(h);
    for(const v of sec.ayat){
      const el=document.createElement('span'); el.className='ayah';
      const words = v.words || v.text.split(' ');
      words.forEach((w,wi)=>{
        const s=document.createElement('span'); s.className='w'; s.textContent=w;
        const k=sec.surah+':'+v.ayah+':'+wi; s.dataset.k=k; wordEl[k]=s; wordOrder.push(k);
        el.appendChild(s); el.appendChild(document.createTextNode(' '));
      });
      const num=document.createElement('span'); num.className='num';
      num.textContent='﴿'+toArabic(v.ayah)+'﴾'; el.appendChild(num);
      textEl.appendChild(el); textEl.appendChild(document.createTextNode(' '));
    }
  }
  // делегированный клик → возврат фокуса на кликнутое слово (запишет его повторно = перечитка)
  textEl.addEventListener('click', e => {
    const w = e.target.closest('.w'); if(!w || !w.dataset.k) return;
    const idx = wordOrder.indexOf(w.dataset.k);
    if(idx >= 0) setFocus(idx, audio.currentTime || 0);
  });
  paintDone();
}

// --- клавиатура: фокус слова ←/→, скорость ↑/↓, пауза Space (мышь-hover не пишет) ---
function wireKeyboard(){
  document.addEventListener('keydown', e => {
    if(e.code === 'Space'){ e.preventDefault(); audio.paused ? audio.play() : audio.pause(); return; }
    // арабский RTL: следующее слово — СЛЕВА, возврат — СПРАВА
    if(e.code === 'ArrowLeft'){  e.preventDefault(); advance(+1); return; }   // след. слово (вперёд по чтению)
    if(e.code === 'ArrowRight'){ e.preventDefault(); advance(-1); return; }   // назад на одно слово (мелкая коррекция)
    if(e.code === 'ArrowUp'){    e.preventDefault(); changeSpeed(+1); return; } // быстрее (до 1×)
    if(e.code === 'ArrowDown'){  e.preventDefault(); changeSpeed(-1); return; } // медленнее (до 0.25×)
    if(e.key === '['){ e.preventDefault(); changeSpeed(-1); return; }
    if(e.key === ']'){ e.preventDefault(); changeSpeed(+1); return; }
  });
  // перемотка нативным ползунком аудио: коммитим открытый интервал по прошлому времени, якорь
  // фокуса пере-ставим на новую позицию (интервал не тянется через шов перемотки).
  audio.addEventListener('seeking', () => { commitFocus(lastT); focusStart = audio.currentTime || 0; });
}

// установить фокус на слово idx: сначала ЗАКОММИТИТЬ открытый интервал текущего фокуса до atTime,
// затем перевести фокус и открыть новый интервал с atTime. Клик по прежде прочитанному слову
// (idx назад) даёт ВТОРОЙ интервал того слова = перечитка (возврат ложится в дорожку сам).
function setFocus(idx, atTime){
  if(idx < 0 || idx >= wordOrder.length) return;
  commitFocus(atTime);
  focusIdx = idx; focusStart = atTime;
  paintFocus();
}
function advance(dir){ setFocus(focusIdx + dir, audio.currentTime || 0); }

// закоммитить открытый интервал текущего фокуса [focusStart, bTime] (если достаточно длинный)
function commitFocus(bTime){
  if(focusIdx < 0) return;
  const k = wordOrder[focusIdx];
  if(bTime - focusStart >= MIN_LEN){
    events.push({k, a: focusStart, b: bTime});
    paintDone(); updateStats();
  }
}
function paintFocus(){
  for(const k in wordEl) wordEl[k].classList.remove('focus');
  const k = wordOrder[focusIdx]; if(k && wordEl[k]) wordEl[k].classList.add('focus');
}

// главный цикл: пока аудио играет, слово-фокус «пишется» (открытый интервал [focusStart, t]);
// смена фокуса (←/→/клик) его коммитит. Мышь-hover НЕ участвует.
function tick(){
  const t = audio.currentTime || 0;
  const recording = !audio.paused && focusIdx >= 0;
  const k = wordOrder[focusIdx];
  if(k && wordEl[k]) wordEl[k].classList.toggle('rec', recording);
  updateAt(t);        // маркер-гид по прогону + автоскролл за фокусом
  // индикатор состояния
  if(recording){ setRec('on', '● запись: ' + (k||'')); }
  else if(audio.paused){ setRec('off', '⏸ пауза'); }
  else { setRec('off', '○ жми → или кликни слово'); }
  lastT = t;
  requestAnimationFrame(tick);
}

// маркер-ГИД позиции по исходному прогону (posRef) — показывает, где алгоритм считает чтеца
// (сравниваешь на слух со своим фокусом). Автоскролл едет за ФОКУСОМ (моя текущая позиция).
function updateAt(t){
  let k = null;
  for(let i=posRef.length-1; i>=0; i--){ if(posRef[i].a <= t){ if(t <= posRef[i].b + 0.5) k = posRef[i].k; break; } }
  if(k !== atKey){
    if(atKey && wordEl[atKey]) wordEl[atKey].classList.remove('at');
    atKey = k;
    if(atKey && wordEl[atKey]) wordEl[atKey].classList.add('at');
  }
  const fk = wordOrder[focusIdx];
  if(!autoScroll || !fk || !wordEl[fk]) return;
  const now = performance.now();
  if(now < userScrollUntil || now < scrollCoolUntil) return;
  const r = wordEl[fk].getBoundingClientRect(); const vh = innerHeight;
  if(r.top >= vh*BAND_TOP && r.top <= vh*BAND_BOT) return;   // фокус уже в комфортной полосе
  scrollTo({top: scrollY + r.top - vh*BAND_AIM, behavior:'smooth'});
  scrollCoolUntil = now + 500;
}

let lastRec = '';
function setRec(cls, txt){
  if(recState.dataset.k === cls+txt) return;
  recState.dataset.k = cls+txt;
  recState.className = 'rec ' + cls; recState.textContent = txt;
}

// подсветка слов, у которых есть записанный интервал
function paintDone(){
  const has = new Set(events.map(e=>e.k));
  for(const k in wordEl) wordEl[k].classList.toggle('done', has.has(k));
}
function updateStats(){
  const covered = new Set(events.map(e=>e.k)).size;
  statsEl.textContent = 'интервалов: ' + events.length + ' · покрыто слов: ' + covered;
}

// --- экспорт: интервалы → word_timeline (совместим с плеером/build_data) ---
// Повтор слова (тот же ключ во ВТОРОЙ раз по времени) помечаем rep=True → плеер/эталон видят возврат.
function buildTimeline(){
  const seen = new Set();
  const wt = events.slice().sort((x,y)=>x.a-y.a).map(e=>{
    const [surah,ayah,wi] = e.k.split(':').map(Number);
    const rep = seen.has(e.k); seen.add(e.k);
    const o = {surah, ayah, wi, t: +e.a.toFixed(3), t_end: +e.b.toFixed(3)};
    if(rep) o.rep = true;
    return o;
  });
  return {source:'manual', rec_id: REC_ID ? +REC_ID : null,
          word_timeline: wt, count: wt.length};
}
function wireButtons(){
  document.getElementById('btnDl').onclick = () => {
    const blob = new Blob([JSON.stringify(buildTimeline(), null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'manual-rec'+(REC_ID||'')+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  };
  document.getElementById('btnCopy').onclick = async () => {
    const txt = JSON.stringify(buildTimeline());
    try { await navigator.clipboard.writeText(txt); flash('btnCopy','скопировано'); }
    catch(e){ flash('btnCopy','не вышло'); }
  };
  document.getElementById('btnClear').onclick = () => {
    if(!events.length || confirm('Стереть все записанные интервалы?')){
      events = []; paintDone(); updateStats();
    }
  };
  document.getElementById('btnSeed').onclick = () => {
    if(events.length && !confirm('Заменить текущие интервалы привязкой из прогона?')) return;
    const n = seedFromData();
    flash('btnSeed', n ? ('залито '+n) : 'нет привязки');
  };
  // П12 v2: сохранить как прогон «manual» в бэк → появится выбираемым в плеере (наравне с forced/ASR)
  document.getElementById('btnSave').onclick = async () => {
    const b = document.getElementById('btnSave'); const old = b.textContent;
    const tl = buildTimeline();
    if(!REC_ID){ flash('btnSave','нет rec'); return; }
    if(!tl.word_timeline.length){ flash('btnSave','нечего сохранять'); return; }
    b.disabled = true; b.textContent = 'сохраняю…';
    try {
      const r = await fetch(API + '/r/' + REC_ID + '/manual/save', {
        method: 'POST',
        body: new URLSearchParams({word_timeline: JSON.stringify(tl.word_timeline)}),
      });
      const j = await r.json().catch(()=>({}));
      b.disabled = false;
      if(r.ok && j.ok){ b.textContent = '✓ прогон manual · '+(j.wt||0)+' сл'; }
      else { b.textContent = '✗ '+((j && j.error) || ('HTTP '+r.status)); }
    } catch(e){ b.disabled = false; b.textContent = '✗ сеть'; }
    setTimeout(()=>{ b.textContent = old; }, 3000);
  };
}
function flash(id, msg){
  const b=document.getElementById(id); const old=b.textContent; b.textContent=msg;
  setTimeout(()=>{ b.textContent=old; }, 1000);
}
function fail(m){ textEl.innerHTML='<div id="err">'+m+'</div>'; }
</script>
